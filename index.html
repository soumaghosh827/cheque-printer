      // Utility: Indian Numbering System Converter (Scales to Crores)
      function convertAmountToIndianWords(amount) {
        if (!amount || isNaN(amount)) return "";
        const [rupeeStr, paiseStr = ""] = String(amount).split(".");
        const num = parseInt(rupeeStr, 10) || 0;
        // ".5" means 50 paise, so pad the typed decimals to two digits
        const paise = parseInt((paiseStr + "00").slice(0, 2), 10) || 0;
        if (num === 0 && paise === 0) return "Zero Rupees Only";

        const a = [
          "",
          "One ",
          "Two ",
          "Three ",
          "Four ",
          "Five ",
          "Six ",
          "Seven ",
          "Eight ",
          "Nine ",
          "Ten ",
          "Eleven ",
          "Twelve ",
          "Thirteen ",
          "Fourteen ",
          "Fifteen ",
          "Sixteen ",
          "Seventeen ",
          "Eighteen ",
          "Nineteen ",
        ];
        const b = [
          "",
          "",
          "Twenty",
          "Thirty",
          "Forty",
          "Fifty",
          "Sixty",
          "Seventy",
          "Eighty",
          "Ninety",
        ];

        function numToWords(n, suffix) {
          let str = "";
          if (n >= 10000000) {
            str += numToWords(Math.floor(n / 10000000), "Crore ");
            str += numToWords(n % 10000000, "");
          } else if (n >= 100000) {
            str += numToWords(Math.floor(n / 100000), "Lakh ");
            str += numToWords(n % 100000, "");
          } else if (n >= 1000) {
            str += numToWords(Math.floor(n / 1000), "Thousand ");
            str += numToWords(n % 1000, "");
          } else if (n >= 100) {
            str += a[Math.floor(n / 100)] + "Hundred ";
            if (n % 100 > 0) str += "and ";
            str += numToWords(n % 100, "");
          } else if (n > 19) {
            str += b[Math.floor(n / 10)] + " " + a[n % 10];
          } else {
            str += a[n];
          }
          if (str.trim() && suffix) str += suffix;
          return str;
        }

        let words = "";
        words += numToWords(Math.floor(num / 10000000), "Crore ");
        words += numToWords(Math.floor((num / 100000) % 100), "Lakh ");
        words += numToWords(Math.floor((num / 1000) % 100), "Thousand ");
        words += numToWords(Math.floor((num / 100) % 10), "Hundred ");

        if (num > 100 && num % 100 > 0) words += "and ";
        words += numToWords(num % 100, "");

        const paiseWords = paise > 0 ? numToWords(paise, "").trim() : "";
        let result;
        if (num === 0) {
          result = `${paiseWords} Paise Only`;
        } else {
          result = `${words.trim()} Rupees${paiseWords ? ` and ${paiseWords} Paise` : ""} Only`;
        }
        return result.replace(/\s+/g, " ");
      }

      // Utility: Wrap text into at most two lines, breaking at the last space before the limit
      function wrapTextToTwoLines(text, maxCharsLine1 = 70) {
        if (text.length <= maxCharsLine1) return { line1: text, line2: "" };
        let lastSpace = text.lastIndexOf(" ", maxCharsLine1);
        if (lastSpace === -1) lastSpace = maxCharsLine1;
        return {
          line1: text.substring(0, lastSpace).trim(),
          line2: text.substring(lastSpace).trim(),
        };
      }

      // Utility: Add the "**" security markers (start of line 1, end of the last line)
      function addSecurityMarkers({ line1, line2 }) {
        if (!line1 && !line2) return { line1: "", line2: "" };
        return line2
          ? { line1: `**${line1}`, line2: `${line2}**` }
          : { line1: `**${line1}**`, line2: "" };
      }

      // Utility: format the raw amount ("1234.5") for the input box, keeping the typed decimal part
      function formatAmountInput(raw) {
        if (!raw) return "";
        const [intPart, decPart] = raw.split(".");
        const intText = Number(intPart || 0).toLocaleString("en-IN");
        return raw.includes(".") ? `${intText}.${decPart}` : intText;
      }

      // Utility: numeric amount as printed on the cheque, e.g. "**1,23,456.50**" (always 2 decimals)
      function formatChequeAmount(raw) {
        if (!raw || isNaN(raw)) return "";
        const text = Number(raw).toLocaleString("en-IN", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
        return `**${text}**`;
      }

      // Reusable renderer: draws a wrapped field (line 1 + optional line 2) from its field config
      function WrappedFieldLines({

        onClick,
        placeholder,

        const rows = [

            left: Number(config.left),

            top: Number(config.top) + Number(config.lineGap || 0),
            left: Number(config.line2Left ?? config.left),
          },
        ];
        return (
          <React.Fragment>
            {rows.map((row, i) => {
              const showPlaceholder =

              return (

                    top: `${row.top}mm`,

                    whiteSpace: "nowrap",

                      : undefined
                  }
                  onClick={preview ? onClick : undefined}
                >
                  {row.text || placeholder}
                </div>
              );
            })}
          </React.Fragment>
        );
      }

      // Reusable wrap-limit control: label, live value badge, -/+ buttons and slider
      function WrapLimitControl({

      }) {
        return (
          <div className="pt-2 border-t border-slate-900 space-y-1.5">

                {value} Chars
              </span>
            </div>
            <div className="flex items-center gap-2">
              <button
                type="button"
                disabled={disabled || value <= min}
                onClick={() => onChange(Math.max(min, value - 1))}
                className="w-8 h-8 bg-slate-950 hover:bg-slate-900 border border-slate-800 rounded-lg flex items-center justify-center text-slate-300 transition-colors disabled:opacity-30 disabled:cursor-not-allowed select-none cursor-pointer"
              >
                <span className="text-sm font-bold">-</span>
              </button>
              <input
                type="range"
                min={min}
                max={max}
                step="1"
                value={value}
                onChange={(e) => onChange(parseInt(e.target.value, 10))}
                disabled={disabled}
                className="flex-1 h-1.5 bg-slate-950 border border-slate-900 rounded-lg appearance-none cursor-pointer accent-blue-500 disabled:opacity-40 disabled:cursor-not-allowed"
              />
              <button
                type="button"
                disabled={disabled || value >= max}
                onClick={() => onChange(Math.min(max, value + 1))}
                className="w-8 h-8 bg-slate-950 hover:bg-slate-900 border border-slate-800 rounded-lg flex items-center justify-center text-slate-300 transition-colors disabled:opacity-30 disabled:cursor-not-allowed select-none cursor-pointer"
              >
                <span className="text-sm font-bold">+</span>
              </button>
            </div>
          </div>
        );
      }

      // Reusable number input: type freely (empty, "-", ".", "-0.5"), tidy up on blur, ↑/↓ keys step
      function NumberField({ value, onChange, step = 1, min, max, ...rest }) {
        const [text, setText] = React.useState(String(value ?? ""));
        const [focused, setFocused] = React.useState(false);

        // Keep the box in sync with outside changes (e.g. switching fields) while not typing
        React.useEffect(() => {
          if (!focused) setText(String(value ?? ""));
        }, [value, focused]);

        const clamp = (n) => {
          if (min !== undefined && n < Number(min)) n = Number(min);
          if (max !== undefined && n > Number(max)) n = Number(max);
          return n;
        };
        const emit = (t) => onChange({ target: { value: t } });

        return (
          <input
            {...rest}
            type="text"
            inputMode="decimal"
            value={text}
            onFocus={(e) => {
              setFocused(true);
              e.target.select(); // typing replaces the old value, so a leftover 0 never gets in the way
            }}
            onBlur={() => {
              setFocused(false);
              const n = clamp(parseFloat(text) || 0);
              setText(String(n));
              emit(String(n));
            }}
            onChange={(e) => {
              const t = e.target.value;
              if (/^-?\d*\.?\d*$/.test(t)) {
                setText(t);
                emit(t);
              }
            }}
            onKeyDown={(e) => {
              if (e.key === "ArrowUp" || e.key === "ArrowDown") {
                e.preventDefault();
                const dir = e.key === "ArrowUp" ? 1 : -1;
                const n = clamp(
                  Math.round(
                    ((parseFloat(text) || 0) + dir * Number(step)) * 1000,
                  ) / 1000,
                );
                setText(String(n));
                emit(String(n));
              }
            }}
          />
        );
      }

                            className="w-3.5 h-3.5 text-amber-500"
                          ></i>
                          <span>
                            Proceed with a New Password (Archive Old Logs)
                          </span>
                        </button>
                      )}
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* FLOATING SYSTEM TOAST ALERTS STACK ROW CONTAINER */}
            <div className="fixed bottom-6 left-6 z-[200] flex flex-col gap-2.5 max-w-sm pointer-events-none no-print select-none">
              {toasts.map((toast) => (
                <div
                  key={toast.id}
                  className={`pointer-events-auto flex items-start gap-2.5 p-3.5 rounded-xl border shadow-xl backdrop-blur-md transition-all duration-300 transform translate-y-0 animate-fade-in
                    ${
                      toast.type === "error"
                        ? "bg-slate-950/95 border-red-500/40 text-red-400"
                        : toast.type === "warning"
                          ? "bg-slate-950/95 border-amber-500/40 text-amber-400"
                          : "bg-slate-950/95 border-emerald-500/40 text-emerald-400"
                    }
                  `}
                >
                  <div className="shrink-0 mt-0.5">
                    <i
                      data-lucide={
                        toast.type === "error"
                          ? "alert-circle"
                          : toast.type === "warning"
                            ? "alert-triangle"
                            : "check-circle"
                      }
                      className="w-4 h-4"
                    ></i>
                  </div>
                  <div className="text-xs font-medium leading-normal tracking-wide text-slate-200">
                    {toast.message}
                  </div>
                  <button
                    type="button"
                    onClick={() =>
                      setToasts((prev) => prev.filter((t) => t.id !== toast.id))
                    }
                    className="ml-auto text-slate-500 hover:text-slate-300 transition-colors pl-1 cursor-pointer"
                  >
                    <i data-lucide="x" className="w-3 h-3"></i>
                  </button>
                </div>
              ))}
            </div>
          </React.Fragment>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
