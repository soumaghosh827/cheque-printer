      /* Global CSS Rules */
      body {
        background-color: #f3f4f6;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        margin: 0;
        padding: 0;
      }

      :root {
        --sb-track: #020617;
        --sb-thumb: #334155;
        --sb-thumb-hover: #475569;
        --stage-bg: #0b1120;
        --stage-vignette: rgba(0, 0, 0, 0.45);
        --stage-glow: rgba(56, 189, 248, 0.1);
        --stage-dot: rgba(148, 163, 184, 0.1);
      }

      /* LIGHT THEME: remaps the slate scale. Dark stays the default (no change). */
      :root[data-theme="light"] {
        --color-slate-950: #ffffff; /* header, sidebar, panels */
        --color-slate-900: #f1f5f9; /* main background */
        --color-slate-800: #e2e8f0; /* borders, badges */
        --color-slate-700: #cbd5e1;
        --color-slate-600: #94a3b8;
        --color-slate-500: #64748b;
        --color-slate-400: #475569; /* secondary text */
        --color-slate-300: #334155;
        --color-slate-200: #1e293b;
        --color-slate-100: #0f172a; /* headings */
        color-scheme: light;
        --sb-track: #ffffff;
        --sb-thumb: #cbd5e1;
        --sb-thumb-hover: #94a3b8;
        --stage-bg: #e2e8f0;
        --stage-vignette: rgba(15, 23, 42, 0.1);
        --stage-glow: rgba(56, 189, 248, 0.18);
        --stage-dot: rgba(71, 85, 105, 0.18);
        /* Accent text shades, darkened so they stay readable on light panels */
        --color-emerald-300: #047857;
        --color-emerald-400: #059669;
        --color-amber-400: #b45309;
        --color-red-400: #dc2626;
        --color-blue-300: #1d4ed8;
        --color-blue-400: #2563eb;
        --color-sky-100: #075985;
        --color-sky-200: #0369a1;
      }

      /* SCREEN PREVIEW CONTEXT ONLY */
      @media screen {
        html,
        body,
        #root {
          height: 100vh !important;
          overflow: hidden !important;
        }
        :root {
          /* Scale factor: 0.60 fits standard laptops nicely without overflow */
          --cheque-scale: 0.6;
        }
        /* Automatically make it slightly larger on huge desktop monitors */
        @media (min-width: 1536px) {
          :root {
            --cheque-scale: 0.75;
          }
        }

        .a4-screen-wrapper {
          /* The stage is now exactly the size of the cheque preview (no A4 sheet) */
          width: calc(var(--cheque-w, 203mm) * (50vw / 297mm)) !important;
          height: calc(var(--cheque-h, 89mm) * (50vw / 297mm)) !important;
          flex-shrink: 0 !important;
          flex-grow: 0 !important;
          position: relative !important;
          display: flex !important;
          flex-direction: row !important;
          justify-content: center !important;
          align-items: center !important;
          box-sizing: border-box !important;
        }

        .cheque-canvas-screen {
          width: calc(var(--cheque-w, 203mm) * (50vw / 297mm)) !important;
          height: calc(var(--cheque-h, 89mm) * (50vw / 297mm)) !important;
          position: relative !important;
          box-sizing: border-box !important;
        }

        /* Target the new inner layout wrapper to translate measurements down dynamically */
        .cheque-canvas-screen .global-offset-wrapper {
          width: var(--cheque-w, 203mm) !important;
          height: var(--cheque-h, 89mm) !important;
          position: absolute !important;
          top: 0 !important;
          left: 0 !important;
          transform-origin: top left !important;
          /* Maps absolute mm coordinates to your viewport scale seamlessly */
          /* transform: scale(calc(50vw / 297mm)) !important; */
        }

        @keyframes chequeSwapIn {
          from {
            opacity: 0;
            transform: translateY(6px) scale(0.985);
          }
          to {
            opacity: 1;
            transform: none;
          }
        }
        .cheque-swap-in {
          animation: chequeSwapIn 380ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @media (prefers-reduced-motion: reduce) {
          .cheque-swap-in {
            animation: none;
          }
        }

        .no-print {
          opacity: 1;
        }
        .print-only {
          display: none !important;
        }

        /* High-fidelity corporate theme scrollbar customization */
        .custom-sidebar-scroll {
          /* Standard cross-browser W3C baseline controls */
          scrollbar-width: thin !important;
          scrollbar-color: var(--sb-thumb) var(--sb-track) !important; /* Thumb: slate-700, Track: slate-950 */
        }

        /* Modern Webkit layout engine specifications (Chrome, Safari, Edge) */
        .custom-sidebar-scroll::-webkit-scrollbar {
          width: 6px !important; /* Slim low-profile width footprint */
          height: 6px !important;
        }

        .custom-sidebar-scroll::-webkit-scrollbar-track {
          background: var(
            --sb-track
          ) !important; /* Match slate-950 panel baseline background */
          border-radius: 0px !important;
        }

        .custom-sidebar-scroll::-webkit-scrollbar-thumb {
          background: var(
            --sb-thumb
          ) !important; /* Match slate-700 interface lines */
          border-radius: 9999px !important; /* High-rounded capsule aesthetic */
          border: 1px solid var(--sb-track) !important; /* Adds clear separation spacing buffer */
        }

        .custom-sidebar-scroll::-webkit-scrollbar-thumb:hover {
          background: var(
            --sb-thumb-hover
          ) !important; /* Glow accent highlights to slate-600 on active hover interaction paths */
        }

        /* Turns the native browser button invisible but keeps its click hitbox fully functional */
        input[type="date"]::-webkit-calendar-picker-indicator {
          position: absolute !important;
          top: 0 !important;
          right: 0 !important;
          width: 2.5rem !important;
          height: 100% !important;
          opacity: 0 !important; /* Completely transparent */
          cursor: pointer !important;
          z-index: 10 !important; /* Sits on top to capture all cursor clicks */
        }
      }

      /* CRITICAL: MASTER PRINT SPECIFICATION SHEET FOR A4 LANDSCAPE */
      @media print {
        @page {
          size: A4 landscape;
          margin: 0mm !important; /* Forces removal of browser headers/footers */
        }

        html,
        body {
          width: 297mm !important;
          height: 210mm !important;
          margin: 0 !important;
          padding: 0 !important;
          background-color: #ffffff !important;
        }

        .no-print {
          display: none !important;
        }

        .print-only {
          display: flex !important;
        }

        /* Absolute alignment architecture for physical hardware limits */
        .printer-viewport-a4 {
          position: absolute !important;
          left: 0 !important;
          top: 0 !important;
          width: 297mm !important;
          height: 210mm !important;
          display: flex !important;
          flex-direction: row !important;
          justify-content: flex-end !important; /* Forces cheque flush right */
          align-items: center !important; /* Forces cheque perfectly in vertical center */
          background: none !important;
          margin: 0 !important;
          padding: 0 !important;
          box-sizing: border-box !important;
        }

        /* Physical bounding target area of the CTS-2010 Cheque */
        .cheque-canvas-print {
          width: 203mm !important;
          height: 89mm !important;
          position: relative !important;
          background-image: none !important; /* Suppresses background check image during printing */
          background-color: transparent !important;
          box-shadow: none !important;
          border: none !important;
          margin: 0 !important;
          padding: 0 !important;
          page-break-inside: avoid !important;
          overflow: visible !important;
          box-sizing: border-box !important;
        }
      }

        try {
          const raw = appStorage.getItem(presetListKey(bank));
          if (raw) return JSON.parse(raw);

          const old = appStorage.getItem(`cheque_preset_${bank}`);

                name: "Saved layout",
                fields: JSON.parse(old),

            ];
            appStorage.setItem(presetListKey(bank), JSON.stringify(migrated));
            return migrated;

        return [];

      // Default state of cheque fields (on/off)
      const DEFAULT_FIELDS_ON = {

      // Utility: Indian Numbering System Converter (Scales to Crores)
      function convertAmountToIndianWords(amount) {
        if (!amount || isNaN(amount)) return "";
        const [rupeeStr, paiseStr = ""] = String(amount).split(".");
        const num = parseInt(rupeeStr, 10) || 0;
        // ".5" means 50 paise, so pad the typed decimals to two digits
        const paise = parseInt((paiseStr + "00").slice(0, 2), 10) || 0;
        if (num === 0 && paise === 0) return "Zero Rupees Only";

        const a = [
          "",
          "One ",
          "Two ",
          "Three ",
          "Four ",
          "Five ",
          "Six ",
          "Seven ",
          "Eight ",
          "Nine ",
          "Ten ",
          "Eleven ",
          "Twelve ",
          "Thirteen ",
          "Fourteen ",
          "Fifteen ",
          "Sixteen ",
          "Seventeen ",
          "Eighteen ",
          "Nineteen ",
        ];
        const b = [
          "",
          "",
          "Twenty",
          "Thirty",
          "Forty",
          "Fifty",
          "Sixty",
          "Seventy",
          "Eighty",
          "Ninety",
        ];

        function numToWords(n, suffix) {
          let str = "";
          if (n >= 10000000) {
            str += numToWords(Math.floor(n / 10000000), "Crore ");
            str += numToWords(n % 10000000, "");
          } else if (n >= 100000) {
            str += numToWords(Math.floor(n / 100000), "Lakh ");
            str += numToWords(n % 100000, "");
          } else if (n >= 1000) {
            str += numToWords(Math.floor(n / 1000), "Thousand ");
            str += numToWords(n % 1000, "");
          } else if (n >= 100) {
            str += a[Math.floor(n / 100)] + "Hundred ";
            if (n % 100 > 0) str += "and ";
            str += numToWords(n % 100, "");
          } else if (n > 19) {
            str += b[Math.floor(n / 10)] + " " + a[n % 10];
          } else {
            str += a[n];
          }
          if (str.trim() && suffix) str += suffix;
          return str;
        }

        let words = "";
        words += numToWords(Math.floor(num / 10000000), "Crore ");
        words += numToWords(Math.floor((num / 100000) % 100), "Lakh ");
        words += numToWords(Math.floor((num / 1000) % 100), "Thousand ");
        words += numToWords(Math.floor((num / 100) % 10), "Hundred ");

        if (num > 100 && num % 100 > 0) words += "and ";
        words += numToWords(num % 100, "");

        const paiseWords = paise > 0 ? numToWords(paise, "").trim() : "";
        let result;
        if (num === 0) {
          result = `${paiseWords} Paise Only`;
        } else {
          result = `${words.trim()} Rupees${paiseWords ? ` and ${paiseWords} Paise` : ""} Only`;
        }
        return result.replace(/\s+/g, " ");
      }

      // Utility: format the raw amount ("1234.5") for the input box, keeping the typed decimal part
      function formatAmountInput(raw) {
        if (!raw) return "";
        const [intPart, decPart] = raw.split(".");
        const intText = Number(intPart || 0).toLocaleString("en-IN");
        return raw.includes(".") ? `${intText}.${decPart}` : intText;
      }

      // Utility: numeric amount as printed on the cheque, e.g. "**1,23,456.50**" (always 2 decimals)
      function formatChequeAmount(raw) {
        if (!raw || isNaN(raw)) return "";
        const text = Number(raw).toLocaleString("en-IN", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
        return `**${text}**`;
      }

      // Reusable wrap-limit control: label, live value badge, -/+ buttons and slider
      function WrapLimitControl({

      // Reusable number input: type freely (empty, "-", ".", "-0.5"), tidy up on blur, ↑/↓ keys step
      function NumberField({ value, onChange, step = 1, min, max, ...rest }) {
        const [text, setText] = React.useState(String(value ?? ""));
        const [focused, setFocused] = React.useState(false);

        // Keep the box in sync with outside changes (e.g. switching fields) while not typing
        React.useEffect(() => {
          if (!focused) setText(String(value ?? ""));
        }, [value, focused]);

        const clamp = (n) => {
          if (min !== undefined && n < Number(min)) n = Number(min);
          if (max !== undefined && n > Number(max)) n = Number(max);
          return n;
        };
        const emit = (t) => onChange({ target: { value: t } });

        return (
          <input
            {...rest}
            type="text"
            inputMode="decimal"
            value={text}
            onFocus={(e) => {
              setFocused(true);
              e.target.select(); // typing replaces the old value, so a leftover 0 never gets in the way
            }}
            onBlur={() => {
              setFocused(false);
              const n = clamp(parseFloat(text) || 0);
              setText(String(n));
              emit(String(n));
            }}
            onChange={(e) => {
              const t = e.target.value;
              if (/^-?\d*\.?\d*$/.test(t)) {
                setText(t);
                emit(t);
              }
            }}
            onKeyDown={(e) => {
              if (e.key === "ArrowUp" || e.key === "ArrowDown") {
                e.preventDefault();
                const dir = e.key === "ArrowUp" ? 1 : -1;
                const n = clamp(
                  Math.round(
                    ((parseFloat(text) || 0) + dir * Number(step)) * 1000,
                  ) / 1000,
                );
                setText(String(n));
                emit(String(n));
              }
            }}
          />
        );
      }

      // ---- Box-based SVG text (font-proof positioning) ----
      let measureCtx = null;
      // Measures text at a 100px reference size, using the same font the SVG will use
      function measureText100(text, fontFamily, fontWeight) {
        if (!measureCtx)
          measureCtx = document.createElement("canvas").getContext("2d");
        const family = String(fontFamily || "Arial");
        measureCtx.font = `${fontWeight || "normal"} 100px ${
          family.includes(",") ? family : `"${family}"`
        }`;
        return measureCtx.measureText(text);
      }

      // Sizes the text so its digits fill `heightRatio` of the box height, shrinks it if it is wider
      // than the box, and returns the font size and baseline position in mm
      // (measured from the cheque's top-left corner)
      function layoutBoxText(text, cfg, chequeWidth) {
        const boxW = Number(cfg.boxWidth);
        const boxH = Number(cfg.boxHeight);
        const zero = measureText100("0", cfg.fontFamily, cfg.fontWeight);
        const asc = zero.actualBoundingBoxAscent;
        const desc = zero.actualBoundingBoxDescent;
        if (!(asc + desc > 0)) return null;

        let size =
          ((Number(cfg.heightRatio) || 0.6) * boxH * 100) / (asc + desc);
        const m = measureText100(text, cfg.fontFamily, cfg.fontWeight);
        const inkLeft = -m.actualBoundingBoxLeft;
        const inkRight = m.actualBoundingBoxRight;
        const inkWidth = ((inkRight - inkLeft) * size) / 100;
        if (inkWidth > boxW) size *= boxW / inkWidth; // shrink to fit

        const k = size / 100;
        const centreX =
          chequeWidth -
          Number(cfg.boxRight) -
          boxW / 2 +
          (Number(cfg.nudgeX) || 0);
        const centreY =
          Number(cfg.boxTop) + boxH / 2 + (Number(cfg.nudgeY) || 0);
        return {
          size,
          x: centreX - ((inkLeft + inkRight) / 2) * k, // centres the visible ink, not the advance width
          y: centreY + ((asc - desc) / 2) * k, // centres the digit height on the box
        };
      }

      // ---- Printed-line text layout (used for payee and amount in words) ----
      // Places up to two lines of text relative to a printed fill-in line on the cheque:
      //  line 1 sits `gapAbove` above the line; line 2 hangs `gapBelow` under it
      //  (or sits above its own printed line when cfg.line2Top is set).
      // textHeight is the capital-letter height in mm, so the size is right in any font.
      function layoutBaselineLines(text, cfg, maxChars, chequeWidth) {
        const num = (v, d) =>
          v === undefined || v === null || v === "" || isNaN(Number(v))
            ? d
            : Number(v);
        const clean = (text || "").trim().replace(/\s+/g, " ");
        const empty = {
          rows: [],
          size: 0,
          shrink: 1,
          wrappedBy: null,
          maxTextHeight: null,
        };
        if (!clean) return empty;

        const textHeight = num(cfg.textHeight, 2.5);
        const lineTop = num(cfg.lineTop, 0);
        const thick = num(cfg.lineThickness, 0.5);
        const gapAbove = num(cfg.gapAbove, 1);
        const gapBelow = num(cfg.gapBelow, 1);
        const left1 = num(cfg.textLeft, 0);
        const left2 = num(cfg.line2Left, left1);
        const nudgeX = num(cfg.nudgeX, 0);
        const nudgeY = num(cfg.nudgeY, 0);
        const avail1 = chequeWidth - num(cfg.textRight, 0) - left1;
        const avail2 =
          chequeWidth - num(cfg.textRight2, num(cfg.textRight, 0)) - left2;
        const cap = measureText100("H", cfg.fontFamily, cfg.fontWeight);
        const capH100 = cap.actualBoundingBoxAscent;
        if (!(capH100 > 0)) return empty;
        let size = (textHeight * 100) / capH100;

        // Visible (ink) width in mm of a string at the current size
        const inkW = (s) => {
          const m = measureText100(s, cfg.fontFamily, cfg.fontWeight);
          return (
            ((m.actualBoundingBoxRight + m.actualBoundingBoxLeft) * size) / 100
          );
        };

        // Wrap at the real size: the character limit and the available width both apply.
        // The first word always stays on line 1. The "**" markers are included in the width.
        // A field with no second printed line (basically payee) stays on one row unless singleLine is false.
        const singleLine =
          cfg.line2Top === undefined && cfg.singleLine !== false;
        const words = clean.split(" ");
        let line1 = singleLine ? clean : words[0];
        let i = singleLine ? words.length : 1;
        let wrappedBy = null;
        for (; i < words.length; i++) {
          const cand = `${line1} ${words[i]}`;
          const isLast = i === words.length - 1;
          if (cand.length > maxChars) {
            wrappedBy = "limit";
            break;
          }
          if (inkW(`**${cand}${isLast ? "**" : ""}`) > avail1) {
            wrappedBy = "width";
            break;
          }
          line1 = cand;
        }
        const line2 = words.slice(i).join(" ");

        // Security markers are applied here, in one place only
        const s1 = line2 ? `**${line1}` : `**${line1}**`;
        const s2 = line2 ? `${line2}**` : "";

        // Shrink only as a last resort (e.g. line 2 or one very long word does not fit)
        const w1 = inkW(s1);
        const w2 = s2 ? inkW(s2) : 0;
        const fitRatio = Math.min(
          w1 > 0 ? avail1 / w1 : Infinity,
          w2 > 0 ? avail2 / w2 : Infinity,
        ); // above 1 means there is room to spare
        const shrink = Math.min(1, fitRatio);
        size *= shrink;

        const k = size / 100;
        const capH = capH100 * k;
        const xFor = (s, left) => {
          const m = measureText100(s, cfg.fontFamily, cfg.fontWeight);
          return left + nudgeX + m.actualBoundingBoxLeft * k; // ink starts exactly at `left`
        };
        const y1 = lineTop + nudgeY - thick / 2 - gapAbove;
        const y2 =
          cfg.line2Top !== undefined
            ? num(cfg.line2Top, 0) + nudgeY - thick / 2 - gapAbove
            : lineTop + nudgeY + thick / 2 + gapBelow + capH;

        return {
          size,
          shrink,
          wrappedBy,
          maxTextHeight: Number.isFinite(fitRatio)
            ? textHeight * fitRatio
            : null,
          rows: [
            { text: s1, x: xFor(s1, left1), y: y1 },
            ...(s2 ? [{ text: s2, x: xFor(s2, left2), y: y2 }] : []),
          ],
        };
      }

      // Draws text laid out by layoutBaselineLines on the real-size SVG.
      // In the preview it also shows guides for the printed line(s) and a clickable area.
      function BaselineLinesText({
        layout,
        cfg,
        cheque,
        color,
        preview,
        active,
        onClick,
      }) {
        const num = (v, d) =>
          v === undefined || v === null || v === "" || isNaN(Number(v))
            ? d
            : Number(v);
        const lineTop = num(cfg.lineTop, 0);
        const thick = num(cfg.lineThickness, 0.5);
        const left1 = num(cfg.textLeft, 0);
        const left2 = num(cfg.line2Left, left1);
        const right1 = cheque.width - num(cfg.textRight, 0);
        const right2 =
          cheque.width - num(cfg.textRight2, num(cfg.textRight, 0));
        const hasLine2 = cfg.line2Top !== undefined;
        const line2Top = num(cfg.line2Top, 0);
        const th = num(cfg.textHeight, 2.5);

        const hitLeft = Math.min(left1, left2);
        const hitRight = Math.max(right1, right2);
        const hitTop = lineTop - thick / 2 - num(cfg.gapAbove, 1) - th - 1;
        const hitBottom = hasLine2
          ? line2Top + thick / 2 + 1
          : lineTop + thick / 2 + num(cfg.gapBelow, 1) + th + 1.5;

        return (
          <svg
            viewBox={`0 0 ${cheque.width} ${cheque.height}`}
            width={`${cheque.width}mm`}
            height={`${cheque.height}mm`}
            style={{
              position: "absolute",
              left: `${PRINT_CANVAS.width - cheque.width}mm`,
              top: `${(PRINT_CANVAS.height - cheque.height) / 2}mm`,
              overflow: "visible",
              pointerEvents: "none",
            }}
          >
            {preview && (
              <g
                onClick={onClick}
                style={{ cursor: "pointer" }}
                pointerEvents="all"
              >
                {/* Text area: the yellow dotted box stays as it is */}
                <rect
                  x={hitLeft}
                  y={hitTop}
                  width={Math.max(hitRight - hitLeft, 0)}
                  height={hitBottom - hitTop}
                  fill={active ? "rgba(245,158,11,0.12)" : "transparent"}
                  stroke={active ? "#f59e0b" : "rgba(100,116,139,0.3)"}
                  strokeWidth="0.15"
                  strokeDasharray="1 1"
                />
                {/* The printed line(s) on the cheque: solid sky-blue rules with end ticks */}
                {[
                  {
                    y: lineTop,
                    l: left1,
                    r: right1,
                    label: hasLine2 ? "Words line 1" : "Payee line",
                  },
                  ...(hasLine2
                    ? [
                        {
                          y: line2Top,
                          l: left2,
                          r: right2,
                          label: "Words line 2",
                        },
                      ]
                    : []),
                ].map((ln, i) => {
                  const c = active ? "#0284c7" : "#38bdf8";
                  return (
                    <g key={i} pointerEvents="none" opacity={active ? 1 : 0.8}>
                      <line
                        x1={ln.l}
                        x2={ln.r}
                        y1={ln.y}
                        y2={ln.y}
                        stroke={c}
                        strokeWidth={Math.max(thick, 0.25)}
                      />
                      <line
                        x1={ln.l}
                        x2={ln.l}
                        y1={ln.y - 1}
                        y2={ln.y + 1}
                        stroke={c}
                        strokeWidth="0.2"
                      />
                      <line
                        x1={ln.r}
                        x2={ln.r}
                        y1={ln.y - 1}
                        y2={ln.y + 1}
                        stroke={c}
                        strokeWidth="0.2"
                      />
                      {active && (
                        <text
                          x={ln.r + 1}
                          y={ln.y + 0.6}
                          fontSize="1.8"
                          fontFamily="system-ui, sans-serif"
                          fill={c}
                        >
                          {ln.label}
                        </text>
                      )}
                    </g>
                  );
                })}
              </g>
            )}
            {layout.rows.map((row, i) => (
              <text
                key={i}
                x={row.x}
                y={row.y}
                fontSize={layout.size}
                fontFamily={cfg.fontFamily}
                fontWeight={cfg.fontWeight || "normal"}
                fill={color}
              >
                {row.text}
              </text>
            ))}
          </svg>
        );
      }

      // Largest Font Size share (0-1) at which `text` still fits the box width without shrinking
      function maxFitRatio(text, cfg) {
        if (!text) return null;
        const zero = measureText100("0", cfg.fontFamily, cfg.fontWeight);
        const m = measureText100(text, cfg.fontFamily, cfg.fontWeight);
        const digitH =
          zero.actualBoundingBoxAscent + zero.actualBoundingBoxDescent;
        const inkW = m.actualBoundingBoxRight + m.actualBoundingBoxLeft;
        if (!(digitH > 0) || !(inkW > 0)) return null;
        const ratio =
          (digitH * Number(cfg.boxWidth)) / (inkW * Number(cfg.boxHeight));
        return Math.min(ratio, 1);
      }

      // Largest Font Size share (0-1) at which the widest digit still fits 90% of a date cell
      function maxFitRatioCells(cfg) {
        const zero = measureText100("0", cfg.fontFamily, cfg.fontWeight);
        const digitH =
          zero.actualBoundingBoxAscent + zero.actualBoundingBoxDescent;
        let widest = 0;
        for (const d of "0123456789") {
          const m = measureText100(d, cfg.fontFamily, cfg.fontWeight);
          widest = Math.max(
            widest,
            m.actualBoundingBoxLeft + m.actualBoundingBoxRight,
          );
        }
        if (!(digitH > 0) || !(widest > 0)) return null;
        const cellW = Number(cfg.boxWidth) / (Number(cfg.cells) || 8);
        return Math.min(
          (digitH * cellW * 0.9) / (widest * Number(cfg.boxHeight)),
          1,
        );
      }

      // Draws one text centred in a box, on an SVG as large as the real cheque.
      // Anchored to the canvas's right edge and vertical centre, like the cheque feed.
      function BoxCenteredText({
        text,
        cfg,
        cheque,
        color,
        preview,
        active,
        onClick,
      }) {
        const layout = text ? layoutBoxText(text, cfg, cheque.width) : null;
        const boxLeft =
          cheque.width - Number(cfg.boxRight) - Number(cfg.boxWidth);
        return (
          <svg
            viewBox={`0 0 ${cheque.width} ${cheque.height}`}
            width={`${cheque.width}mm`}
            height={`${cheque.height}mm`}
            style={{
              position: "absolute",
              left: `${PRINT_CANVAS.width - cheque.width}mm`,
              top: `${(PRINT_CANVAS.height - cheque.height) / 2}mm`,
              overflow: "visible",
              pointerEvents: "none",
            }}
          >
            {preview && (
              <rect
                x={boxLeft}
                y={Number(cfg.boxTop)}
                width={Number(cfg.boxWidth)}
                height={Number(cfg.boxHeight)}
                fill={active ? "rgba(245,158,11,0.12)" : "transparent"}
                stroke={active ? "#f59e0b" : "rgba(100,116,139,0.5)"}
                strokeWidth="0.15"
                strokeDasharray="1 1"
                style={{ cursor: "pointer" }}
                onClick={onClick}
                pointerEvents="all"
              />
            )}
            {layout && (
              <text
                x={layout.x}
                y={layout.y}
                fontSize={layout.size}
                fontFamily={cfg.fontFamily}
                fontWeight={cfg.fontWeight || "normal"}
                fill={color}
              >
                {text}
              </text>
            )}
          </svg>
        );
      }

      // Splits the box into equal cells and returns each digit's position, centred in its cell
      function layoutCells(chars, cfg, chequeWidth) {
        const cells = Number(cfg.cells) || 8;
        const cellW = Number(cfg.boxWidth) / cells;
        const boxH = Number(cfg.boxHeight);
        const zero = measureText100("0", cfg.fontFamily, cfg.fontWeight);
        const asc = zero.actualBoundingBoxAscent;
        const desc = zero.actualBoundingBoxDescent;
        if (!(asc + desc > 0)) return null;

        let size =
          ((Number(cfg.heightRatio) || 0.6) * boxH * 100) / (asc + desc);

        // Use the widest of 0-9 so the size never changes from one date to the next
        let widest = 0;
        for (const d of "0123456789") {
          const m = measureText100(d, cfg.fontFamily, cfg.fontWeight);
          widest = Math.max(
            widest,
            m.actualBoundingBoxLeft + m.actualBoundingBoxRight,
          );
        }
        const limit = cellW * 0.9; // keep digits off the cell borders
        if ((widest * size) / 100 > limit)
          size *= limit / ((widest * size) / 100);

        const k = size / 100;
        const boxLeft =
          chequeWidth - Number(cfg.boxRight) - Number(cfg.boxWidth);
        const centreY =
          Number(cfg.boxTop) + boxH / 2 + (Number(cfg.nudgeY) || 0);
        const y = centreY + ((asc - desc) / 2) * k;

        const digits = chars.slice(0, cells).map((ch, i) => {
          if (!ch) return null;
          const m = measureText100(ch, cfg.fontFamily, cfg.fontWeight);
          const inkLeft = -m.actualBoundingBoxLeft;
          const inkRight = m.actualBoundingBoxRight;
          const cx = boxLeft + (i + 0.5) * cellW + (Number(cfg.nudgeX) || 0);
          return { ch, x: cx - ((inkLeft + inkRight) / 2) * k };
        });
        return { size, y, digits };
      }

      // Draws the date: one digit per cell, each centred in its cell
      function BoxCenteredCells({
        chars,
        cfg,
        cheque,
        color,
        preview,
        active,
        onClick,
      }) {
        const layout = layoutCells(chars, cfg, cheque.width);
        const cells = Number(cfg.cells) || 8;
        const cellW = Number(cfg.boxWidth) / cells;
        const boxLeft =
          cheque.width - Number(cfg.boxRight) - Number(cfg.boxWidth);
        const boxTop = Number(cfg.boxTop);
        const boxH = Number(cfg.boxHeight);
        return (
          <svg
            viewBox={`0 0 ${cheque.width} ${cheque.height}`}
            width={`${cheque.width}mm`}
            height={`${cheque.height}mm`}
            style={{
              position: "absolute",
              left: `${PRINT_CANVAS.width - cheque.width}mm`,
              top: `${(PRINT_CANVAS.height - cheque.height) / 2}mm`,
              overflow: "visible",
              pointerEvents: "none",
            }}
          >
            {preview && (
              <g
                onClick={onClick}
                style={{ cursor: "pointer" }}
                pointerEvents="all"
              >
                <rect
                  x={boxLeft}
                  y={boxTop}
                  width={Number(cfg.boxWidth)}
                  height={boxH}
                  fill={active ? "rgba(245,158,11,0.12)" : "transparent"}
                  stroke={active ? "#f59e0b" : "rgba(100,116,139,0.5)"}
                  strokeWidth="0.15"
                  strokeDasharray="1 1"
                />
                {Array.from({ length: cells - 1 }, (_, i) => (
                  <line
                    key={i}
                    x1={boxLeft + (i + 1) * cellW}
                    x2={boxLeft + (i + 1) * cellW}
                    y1={boxTop}
                    y2={boxTop + boxH}
                    stroke="rgba(100,116,139,0.35)"
                    strokeWidth="0.1"
                    strokeDasharray="1 1"
                  />
                ))}
              </g>
            )}
            {layout &&
              layout.digits.map(
                (d, i) =>
                  d && (
                    <text
                      key={i}
                      x={d.x}
                      y={layout.y}
                      fontSize={layout.size}
                      fontFamily={cfg.fontFamily}
                      fontWeight={cfg.fontWeight || "normal"}
                      fill={color}
                    >
                      {d.ch}
                    </text>
                  ),
              )}
          </svg>
        );
      }

      // Calibration sheet: A4 landscape marks drawn in true mm.
      // Printed through the normal print path, so it shows what a real cheque print does.
      function CalibrationSheet() {
        const W = 297;
        const H = 210;
        const CW = PRINT_CANVAS.width;
        const CH = PRINT_CANVAS.height;
        const ox = W - CW; // cheque area left edge (flush right)
        const oy = (H - CH) / 2; // cheque area top edge (vertically centred)
        const line = { stroke: "#000", strokeWidth: 0.2, fill: "none" };
        const label = { fill: "#000", fontFamily: "Arial, sans-serif" };

        const Cross = ({ x, y, r = 5 }) => (
          <g {...line}>
            <line x1={x - r} y1={y} x2={x + r} y2={y} />
            <line x1={x} y1={y - r} x2={x} y2={y + r} />
          </g>
        );
        const hTicks = Array.from({ length: 26 }, (_, i) => i * 10); // 0 to 250 mm
        const vTicks = Array.from({ length: 19 }, (_, i) => i * 10); // 0 to 180 mm

        return (
          <svg
            viewBox={`0 0 ${W} ${H}`}
            width={`${W}mm`}
            height={`${H}mm`}
            style={{ position: "absolute", left: 0, top: 0 }}
          >
            {/* Corner crosshairs: centres 10 mm from each paper edge */}
            <Cross x={10} y={10} />
            <Cross x={W - 10} y={10} />
            <Cross x={10} y={H - 10} />
            <Cross x={W - 10} y={H - 10} />
            <Cross x={W / 2} y={H / 2} />

            {/* Edge marks: start exactly at the paper edge, show printer clipping */}
            <g {...line}>
              <line x1={0} y1={H / 2} x2={10} y2={H / 2} />
              <line x1={W - 10} y1={H / 2} x2={W} y2={H / 2} />
              <line x1={W / 2} y1={0} x2={W / 2} y2={10} />
              <line x1={W / 2} y1={H - 10} x2={W / 2} y2={H} />
            </g>

            {/* Rulers: origin at 20,20 mm. 250 mm across, 180 mm down */}
            <g {...line}>
              <line x1={20} y1={20} x2={270} y2={20} />
              <line x1={20} y1={20} x2={20} y2={200} />
              {hTicks.map((t) => (
                <line
                  key={`h${t}`}
                  x1={20 + t}
                  y1={20}
                  x2={20 + t}
                  y2={20 + (t % 50 === 0 ? 5 : 3)}
                />
              ))}
              {vTicks.map((t) => (
                <line
                  key={`v${t}`}
                  x1={20}
                  y1={20 + t}
                  x2={20 + (t % 50 === 0 ? 5 : 3)}
                  y2={20 + t}
                />
              ))}
            </g>
            {[50, 100, 150, 200, 250].map((t) => (
              <text
                key={`ht${t}`}
                x={20 + t}
                y={30}
                fontSize="3"
                textAnchor="middle"
                {...label}
              >
                {t}
              </text>
            ))}
            {[50, 100, 150].map((t) => (
              <text
                key={`vt${t}`}
                x={27}
                y={20 + t + 1}
                fontSize="3"
                {...label}
              >
                {t}
              </text>
            ))}

            {/* Cheque area (203 x 89, flush right, centred): corner marks + centre */}
            <g {...line}>
              <polyline
                points={`${ox},${oy + 8} ${ox},${oy} ${ox + 8},${oy}`}
              />
              <polyline
                points={`${ox},${oy + CH - 8} ${ox},${oy + CH} ${ox + 8},${oy + CH}`}
              />
              {/* Right corners: horizontal ticks only (a vertical line on the paper edge would clip) */}
              <line x1={W - 8} y1={oy} x2={W} y2={oy} />
              <line x1={W - 8} y1={oy + CH} x2={W} y2={oy + CH} />
            </g>
            <Cross x={ox + CW / 2} y={H / 2} />
            <text x={ox + 12} y={oy + 14} fontSize="3" {...label}>
              {`Cheque area ${CW} x ${CH} mm (left edge ${ox} mm, top ${oy} mm)`}
            </text>

            {/* Line thickness strip */}
            {[0.1, 0.2, 0.3, 0.5].map((t, i) => (
              <g key={`t${t}`}>
                <line
                  x1={40}
                  y1={150 + i * 6}
                  x2={80}
                  y2={150 + i * 6}
                  stroke="#000"
                  strokeWidth={t}
                />
                <text x={83} y={151 + i * 6} fontSize="3" {...label}>
                  {t} mm
                </text>
              </g>
            ))}

            {/* Titles and orientation */}
            <text x={40} y={45} fontSize="4" fontWeight="bold" {...label}>
              PRINT CALIBRATION - A4 landscape, 100%
            </text>
            <text x={40} y={51} fontSize="3" {...label}>
              Crosshair centres: 277 x 190 mm apart, 10 mm from each paper edge
            </text>
            <text
              x={W / 2}
              y={17}
              fontSize="4"
              fontWeight="bold"
              textAnchor="middle"
              {...label}
            >
              TOP
            </text>
            <text
              x={W - 14}
              y={40}
              fontSize="4"
              fontWeight="bold"
              textAnchor="end"
              {...label}
            >
              RIGHT
            </text>
          </svg>
        );
      }

      // One place that draws every cheque field. Preview and print both use it, so they can't drift.
      // mode "preview": editable, off-fields shown as ghosts. mode "print": black ink, only fields that are on.
      function ChequeArtwork({
        mode,
        fields,
        fieldsOn,
        amountText,
        dateChars,
        payeeLayout,
        wordsLayout,
        usePayeeSvg,
        useWordsSvg,
        focusKey,
        onFocusField,
        onAcPayeeClick,
      }) {
        const preview = mode === "preview";
        const ink = preview ? "#0f172a" : "#000000";
        const acOn = !!fieldsOn.acPayee;
        const ac = fields.acPayee || {};
        const ghost = (on) => (preview && !on ? { opacity: 0.25 } : undefined);
        const acLine = {
          width: "100%",
          height: 0,
          borderTop: acOn ? `0.3mm solid ${ink}` : "0.3mm dashed #64748b",
        };

        return (
          <>
            {/* A/C Payee crossing */}
            {(preview || acOn) && (
              <div
                style={{
                  position: "absolute",
                  top: `${ac.top ?? 5.0}mm`,
                  left: `${ac.left ?? 6.0}mm`,
                  width: `${ac.width ?? 50.0}mm`,
                  height: "10mm",
                  display: "flex",
                  flexDirection: "column",
                  justifyContent: "center",
                  alignItems: "center",
                  fontFamily: ac.fontFamily || "Arial",
                  transform: `rotate(${ac.angle ?? -15}deg)`,
                  transformOrigin: "center center",
                  userSelect: preview ? "none" : undefined,
                }}
                className={
                  preview
                    ? `cursor-pointer rounded transition-all duration-200 ${
                        acOn ? "" : "opacity-40 hover:opacity-80"
                      } ${
                        focusKey === "acPayee" && acOn
                          ? "ring-2 ring-amber-500 bg-amber-500/10 border-amber-500/30"
                          : acOn
                            ? "hover:bg-slate-400/20"
                            : ""
                      }`
                    : undefined
                }
                title={
                  preview && !acOn
                    ? "Click to add the A/C Payee crossing"
                    : undefined
                }
                onClick={preview ? onAcPayeeClick : undefined}
              >
                <div style={acLine}></div>
                <span
                  style={{
                    fontSize: `${ac.fontSize || 3.2}mm`,
                    letterSpacing: `${ac.letterSpacing ?? 0.4}mm`,
                    fontWeight: `${ac.fontWeight || "normal"}`,
                    ...(preview
                      ? {}
                      : {
                          color: ink,
                          textTransform: "uppercase",
                          margin: "0.5mm 0",
                        }),
                  }}
                  className={
                    preview
                      ? `uppercase tracking-widest my-0.5 ${
                          acOn ? "text-zinc-900" : "text-zinc-500"
                        }`
                      : undefined
                  }
                >
                  {preview && !acOn ? "+ A/C Payee" : "A/C Payee"}
                </span>
                <div style={acLine}></div>
              </div>
            )}

            {/* Payee name */}
            {usePayeeSvg && (preview || fieldsOn.payee) && (
              <div style={ghost(fieldsOn.payee)}>
                <BaselineLinesText
                  layout={payeeLayout}
                  cfg={fields.payee}
                  cheque={fields.cheque}
                  color={ink}
                  preview={preview}
                  active={preview && focusKey === "payee"}
                  onClick={() => onFocusField("payee")}
                />
              </div>
            )}

            {/* Amount in words */}
            {useWordsSvg && (preview || fieldsOn.amountWords) && (
              <div style={ghost(fieldsOn.amountWords)}>
                <BaselineLinesText
                  layout={wordsLayout}
                  cfg={fields.amountWords}
                  cheque={fields.cheque}
                  color={ink}
                  preview={preview}
                  active={preview && focusKey === "amountWords"}
                  onClick={() => onFocusField("amountWords")}
                />
              </div>
            )}

            {/* Numeric amount */}
            {fields.cheque && (preview || fieldsOn.amountNumeric) && (
              <div style={ghost(fieldsOn.amountNumeric)}>
                <BoxCenteredText
                  text={amountText}
                  cfg={fields.amountNumeric}
                  cheque={fields.cheque}
                  color={ink}
                  preview={preview}
                  active={preview && focusKey === "amountNumeric"}
                  onClick={() => onFocusField("amountNumeric")}
                />
              </div>
            )}

            {/* Date, one digit per cell */}
            {fields.cheque && (preview || fieldsOn.date) && (
              <div style={ghost(fieldsOn.date)}>
                <BoxCenteredCells
                  chars={dateChars}
                  cfg={fields.date}
                  cheque={fields.cheque}
                  color={ink}
                  preview={preview}
                  active={preview && focusKey === "date"}
                  onClick={() => onFocusField("date")}
                />
              </div>
            )}
          </>
        );
      }

      // Cheque-sized calibration marks, drawn in cheque coordinates like the real fields.
      // Crosshairs sit 5 mm inside each cheque edge. Also outlines the date and amount boxes from the preset.
      function ChequeCalibration({ fields }) {
        const cw = fields.cheque?.width ?? PRINT_CANVAS.width;
        const ch = fields.cheque?.height ?? PRINT_CANVAS.height;
        const inset = 5;
        const line = { stroke: "#000", strokeWidth: 0.2, fill: "none" };
        const Cross = ({ x, y, r = 3 }) => (
          <g {...line}>
            <line x1={x - r} y1={y} x2={x + r} y2={y} />
            <line x1={x} y1={y - r} x2={x} y2={y + r} />
          </g>
        );
        const boxOf = (cfg) =>
          cfg && cfg.boxWidth !== undefined
            ? {
                left: cw - Number(cfg.boxRight) - Number(cfg.boxWidth),
                top: Number(cfg.boxTop),
                w: Number(cfg.boxWidth),
                h: Number(cfg.boxHeight),
                cells: Number(cfg.cells) || 1,
              }
            : null;
        const dateBox = boxOf(fields.date);
        const amountBox = boxOf(fields.amountNumeric);

        return (
          <svg
            viewBox={`0 0 ${cw} ${ch}`}
            width={`${cw}mm`}
            height={`${ch}mm`}
            style={{
              position: "absolute",
              left: `${PRINT_CANVAS.width - cw}mm`,
              top: `${(PRINT_CANVAS.height - ch) / 2}mm`,
              overflow: "visible",
            }}
          >
            <Cross x={inset} y={inset} />
            <Cross x={cw - inset} y={inset} />
            <Cross x={inset} y={ch - inset} />
            <Cross x={cw - inset} y={ch - inset} />
            <Cross x={cw / 2} y={ch / 2} />
            {[dateBox, amountBox].map(
              (b, i) =>
                b && (
                  <g key={i} {...line}>
                    <rect x={b.left} y={b.top} width={b.w} height={b.h} />
                    {Array.from({ length: b.cells - 1 }, (_, c) => (
                      <line
                        key={c}
                        x1={b.left + ((c + 1) * b.w) / b.cells}
                        x2={b.left + ((c + 1) * b.w) / b.cells}
                        y1={b.top}
                        y2={b.top + b.h}
                        strokeWidth={0.1}
                      />
                    ))}
                  </g>
                ),
            )}
            <text
              x={cw / 2}
              y={ch / 2 + 6}
              fontSize="2.5"
              textAnchor="middle"
              fill="#000"
              fontFamily="Arial, sans-serif"
            >
              {`Marks 5 mm inside each edge (${cw} x ${ch} mm)`}
            </text>
          </svg>
        );
      }

      // Collapsible section, closed by default (used for the "Exact positions" settings)
      function Collapsible({ title, children, defaultOpen = false }) {
        const [open, setOpen] = React.useState(defaultOpen);
        return (
          <div className="col-span-2 border border-slate-800 rounded-lg bg-slate-950/40">
            <button
              type="button"
              onClick={() => setOpen(!open)}
              className="w-full flex items-center justify-between px-3 py-2 text-[11px] font-mono uppercase tracking-wider text-slate-400 hover:text-slate-200 cursor-pointer select-none"
            >
              <span>{title}</span>
              <span className="text-slate-500 text-sm leading-none">
                {open ? "−" : "+"}
              </span>
            </button>
            {open && (
              <div className="grid grid-cols-2 gap-3 p-3 pt-1">{children}</div>
            )}
          </div>
        );
      }

      // Label + number input + optional small hint underneath.
      // Labels reserve two lines (tall) so inputs in the same row always line up.
      function LabeledNumber({
        label,
        hint,
        warn,
        tall = true,
        ...inputProps
      }) {
        return (
          <div className="flex flex-col">
            <label
              className={`text-[11px] leading-tight text-slate-400 mb-1 ${
                tall ? "min-h-[2rem] flex items-end" : ""
              }`}
            >
              {label}
            </label>
            <NumberField
              {...inputProps}
              className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm font-mono text-center text-blue-400 focus:outline-none"
            />
            {hint && (
              <div
                className={`mt-1 text-[10px] leading-tight ${
                  warn ? "text-amber-400" : "text-slate-500"
                }`}
              >
                {hint}
              </div>
            )}
          </div>
        );
      }

      // Runs fn once a smooth scroll has settled (the element stops moving), or after 1.2 s at most
      function afterScrollSettles(el, fn) {
        const start = performance.now();
        let lastTop = el.getBoundingClientRect().top;
        let still = 0;
        const tick = () => {
          const top = el.getBoundingClientRect().top;
          still = Math.abs(top - lastTop) < 0.5 ? still + 1 : 0;
          lastTop = top;
          const elapsed = performance.now() - start;
          if ((still >= 4 && elapsed > 120) || elapsed > 1200) fn();
          else requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }

      // Small on/off switch used next to each field's label (same look as the A/C Payee switch)
      function FieldSwitch({ on, onChange, label, disabled }) {
        return (
          <button
            type="button"
            role="switch"
            aria-checked={on}
            aria-label={label}
            title={on ? `Turn ${label} off` : `Turn ${label} on`}
            disabled={disabled}
            onClick={() => onChange(!on)}
            className={`relative inline-flex h-4 w-7 shrink-0 items-center rounded-full transition-colors duration-200 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed ${
              on ? "bg-emerald-500" : "bg-slate-700"
            }`}
          >
            <span
              className={`inline-block h-3 w-3 rounded-full bg-white shadow transition-transform duration-200 ${
                on ? "translate-x-[0.875rem]" : "translate-x-0.5"
              }`}
            />
          </button>
        );
      }

      // Lighter "raised card" that fades in behind a left-panel section (takes no layout space)
      function FocusBackdrop({ on, inset = "-inset-2" }) {
        return (
          <div
            aria-hidden="true"
            className={`pointer-events-none absolute ${inset} -z-10 !mt-0 rounded-xl bg-slate-800/70 ring-1 ring-white/5 shadow-[0_10px_30px_-8px_rgba(0,0,0,0.7)] transition-all duration-300 ease-out ${
              on ? "opacity-100" : "opacity-0"
            }`}
          />
        );
      }

      const PRINTER_KEY = "cheque_printer_name"; // the chosen printer, remembered between runs
      const THEME_KEY = "cheque_theme"; // "light" or "dark", remembered between runs

      const PRINTER_CAL_KEY = "cheque_printer_calibration"; // { "<printer name>": { x, y } } in mm
      function loadPrinterCal(printer) {
        try {
          const all = JSON.parse(appStorage.getItem(PRINTER_CAL_KEY) || "{}");
          const c = all[printer] || {};
          return { x: Number(c.x) || 0, y: Number(c.y) || 0 };
        } catch {
          return { x: 0, y: 0 };
        }
      }
      function savePrinterCal(printer, cal) {
        try {
          const all = JSON.parse(appStorage.getItem(PRINTER_CAL_KEY) || "{}");
          all[printer] = { x: Number(cal.x) || 0, y: Number(cal.y) || 0 };
          appStorage.setItem(PRINTER_CAL_KEY, JSON.stringify(all));
        } catch {}
      }

      // Counts the digits and decimal points before position `pos`. Commas don't count,
      // so they can appear and disappear while formatting without moving the caret.
      function countAmountChars(text, pos) {
        let n = 0;
        for (let i = 0; i < pos && i < text.length; i++) {
          if (/[0-9.]/.test(text[i])) n++;
        }
        return n;
      }

      // Puts the caret right after the n-th digit or decimal point of the formatted value
      function placeAmountCaret(el, n) {
        let pos = 0;
        let seen = 0;
        while (pos < el.value.length && seen < n) {
          if (/[0-9.]/.test(el.value[pos])) seen++;
          pos++;
        }
        el.setSelectionRange(pos, pos);
      }

      const SUGGESTIONS_KEY = "suggestions"; // the names actually used, most recent first
      const SEED_PAYEES = window.SEED_PAYEES || []; // starting list from payees-seed.js (desktop only)

      function cleanPayeeName(name) {
        return String(name || "")
          .trim()
          .replace(/\s+/g, " ");
      }

      // Used names first (most recent on top), then the starting list, without duplicates
      function mergeSuggestions(used, seed) {
        const seen = new Set();
        const out = [];
        [...used, ...seed].forEach((n) => {
          const clean = cleanPayeeName(n);
          const key = clean.toLowerCase();
          if (clean && !seen.has(key)) {
            seen.add(key);
            out.push(clean);
          }
        });
        return out;
      }

      // Device-bound protection (desktop only). In a browser these do nothing.
      const protectText = (t) =>
        window.desktop?.protectText ? window.desktop.protectText(t) : t;
      const unprotectText = (t) =>
        window.desktop?.unprotectText ? window.desktop.unprotectText(t) : t;

      function App() {
        // STATES START HERE --------------------------------------------------------------

        // Document States
        const [selectedBank, setSelectedBank] = useState("sbi");
        const [payeeName, setPayeeName] = useState("");
        const [amount, setAmount] = useState("0");
        const [chequeDate, setChequeDate] = useState(
          new Date().toISOString().split("T")[0],
        ); // Target standard YYYY-MM-DD format

        // Configuration Layout Positioning Matrices
        const [fields, setFields] = useState(DEFAULT_PRESETS.sbi.fields);
        const [activeFieldKey, setActiveFieldKey] = useState("payee");
        const [fieldsOn, setFieldsOn] = useState(DEFAULT_FIELDS_ON);
        const [hasFocus, setHasFocus] = useState(false); // highlights on or off; Settings keep activeFieldKey
        const focusKey = hasFocus ? activeFieldKey : null;

        const [presets, setPresets] = useState([]); // saved presets for the selected bank
        const [activePresetId, setActivePresetId] = useState(null); // null = factory default

        const [namingOpen, setNamingOpen] = useState(false); // inline "name this preset" box
        const [newPresetName, setNewPresetName] = useState("");
        const activePreset = presets.find((p) => p.id === activePresetId);
        const presetEdited =
          JSON.stringify(fields) !==
          JSON.stringify(
            activePreset
              ? activePreset.fields
              : DEFAULT_PRESETS[selectedBank].fields,
          );
        const [showPresetManager, setShowPresetManager] = useState(false);

        const [printHistory, setPrintHistory] = useState(
          () => JSON.parse(appStorage.getItem("cheque_print_history")) || [],
        );

        const [theme, setTheme] = useState(() =>
