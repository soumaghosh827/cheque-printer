          setCalibrationMode(true);
          await new Promise((r) => setTimeout(r, 150)); // let the sheet render first
          const result = await printSheet();
          setCalibrationMode(false);
          if (result && result.success === false) {
            showToast(result.reason || "Calibration print failed", "error");
          }
        };

        const handlePrintChequeCal = async () => {
          setChequeCalMode(true);
          await new Promise((r) => setTimeout(r, 150));
          const result = await printSheet();
          setChequeCalMode(false);
          if (result && result.success === false) {
            showToast(result.reason || "Calibration print failed", "error");
          }
        };

        // Function to execute print and log the event with a Print logic
        // that holds the log entry in a "pending state" until manually verified
        const handleExecutePrint = async () => {
          const currentTimeObj = new Date();
          const localizedTimeString = currentTimeObj.toLocaleString("en-IN", {
            timeZone: "Asia/Kolkata",
          });

          // 1. Construct the prospective log payload
          const prospectiveLog = {
            "Bank Template": selectedBank.toUpperCase(),
            "Payee Legal Name": fieldsOn.payee ? payeeName : "—",
            "Transaction Amount (₹)":
              fieldsOn.amountNumeric || fieldsOn.amountWords
                ? parseFloat(amount) || 0
                : 0,
            "Cheque Date": fieldsOn.date ? chequeDate : "—",
            Timestamp: localizedTimeString,
          };

          // 3. Print, then hold the record until the user confirms the cheque came out right
          if (printingRef.current) return; // a print is already in progress
          printingRef.current = true;
          try {
            const result = await printSheet();
            if (!result.success) {
              // A cancelled dialog is normal; anything else is worth telling the user
              if (result.reason && !/cancel/i.test(result.reason)) {
                showToast(`Printing failed: ${result.reason}`, "error");
              }
              return;
            }
            setPendingLogEntry(prospectiveLog);
            setShowVerifyToast(true);
          } finally {
            printingRef.current = false;
          }
        };

        // Print Cheque and Ctrl+P land here. Desktop: open the print panel. Browser: print as before.
        const requestPrint = async () => {
          if (!window.desktop?.printers) return handleExecutePrint();
          setPrinterNote("");
          setShowPrintPanel(true);
          try {
            const list = await window.desktop.printers();
            setPrinters(list);
            if (list.length === 0) {
              setSelectedPrinter("");
              setPrinterNote(
                "No printers found. Install a printer in Windows and try again.",
              );
              return;
            }
            // Only a printer you chose before is preselected. Nothing is guessed.
            const saved = appStorage.getItem(PRINTER_KEY);
            const found = list.find((p) => p.name === saved);
            setSelectedPrinter(found ? found.name : "");
            if (saved && !found)
              setPrinterNote(`"${saved}" isn't available. Choose a printer.`);
          } catch {
            setPrinterNote("Could not read the printer list.");
          }
        };

        const confirmPrint = () => {
          if (!selectedPrinter) return;
          appStorage.setItem(PRINTER_KEY, selectedPrinter);
          setShowPrintPanel(false);
          handleExecutePrint();
        };

        // Ctrl+P (Cmd+P on a Mac) follows the same path as the Print Cheque button, so the cheque
        // is logged after you confirm it, and the A/C Payee switch resets.
        const printActionRef = React.useRef(null);
        printActionRef.current = requestPrint; // always the latest version, with the current inputs
        useEffect(() => {
          const onKeyDown = (e) => {
            const isPrintKey =
              (e.ctrlKey || e.metaKey) &&
              !e.shiftKey &&
              !e.altKey &&
              (e.key.toLowerCase() === "p" || e.code === "KeyP");
            if (!isPrintKey) return;
            // Dashboard locked, or a print already waiting to be confirmed: leave the browser's default
            if (isDashboardLocked || showVerifyToast || showPrintPanel) return;
            e.preventDefault();
            if (e.repeat) return; // holding the keys down must not open several print dialogs
            printActionRef.current();
          };
          window.addEventListener("keydown", onKeyDown);
          return () => window.removeEventListener("keydown", onKeyDown);
        }, [isDashboardLocked, showVerifyToast, showPrintPanel]);

        // Executes if the user confirms the physical cheque leaf printed cleanly
        const confirmPrintSuccess = () => {
          if (!pendingLogEntry || !encryptionKey) return;

          const finalUpdatedHistory = [pendingLogEntry, ...printHistory];
          setPrintHistory(finalUpdatedHistory);

          // Encrypt the entire collection payload package on the fly
          const ciphertext = CryptoJS.AES.encrypt(
            JSON.stringify(finalUpdatedHistory),
            encryptionKey,
          ).toString();
          appStorage.setItem("cheque_print_history_encrypted", ciphertext);

          // Clear out UI notification alert anchors
          setShowVerifyToast(false);
          setPendingLogEntry(null);
          if (fieldsOn.payee)
            rememberPayee(pendingLogEntry["Payee Legal Name"]); // the name that was printed, not what is typed now
          resetFieldsOn(); // reset to default after a confirmed print
        };

        // Executes if the hardware jammed or failed
        const discardFailedPrint = () => {
          setShowVerifyToast(false);
          setPendingLogEntry(null);
        };

        // Function to compile history array and download a formatted Excel report
        const exportHistoryToExcel = () => {
          if (printHistory.length === 0) {
            showToast("No Cheque Print Logs found!", "error");
            return;
          }

          // Create a clean layout worksheet object mapping our structured column fields
          const worksheet = XLSX.utils.json_to_sheet(printHistory);
          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(
            workbook,
            worksheet,
            "Printed Cheques Log",
          );

          // Format column widths dynamically so strings fit comfortably inside cells
          const maxProps = [
            { wch: 24 }, // Timestamp
            { wch: 20 }, // Bank Template Used
            { wch: 35 }, // Payee Legal Name
            { wch: 22 }, // Transaction Amount
            { wch: 22 }, // Date
          ];
          worksheet["!cols"] = maxProps;

          // Generate localized date string for filename resolution
          const fileDate = new Date().toISOString().split("T")[0];
          XLSX.writeFile(workbook, `Cheque_Print_Report_${fileDate}.xlsx`);
        };

        // Clear local logs with double-check alert parameters
        const clearPrintHistory = () => {
          if (
            confirm(
              "Are you absolutely sure you want to purge all printed logs on this machine? This action cannot be undone.",
            )
          ) {
            setPrintHistory([]);
            appStorage.removeItem("cheque_print_history_encrypted");
          }
        };

        // Gathers all bank layouts from localStorage and compiles a downloadable backup file
        const exportConfigurationsToFile = () => {
          const presetsByBank = {};

          // Pull every saved preset list (v2) for each bank
          BANK_KEYS.forEach((bankKey) => {
            const list = loadPresets(bankKey);
            if (list.length > 0) {
              presetsByBank[bankKey] = list;
            }
          });

          const backupPayload = { version: 2, presets: presetsByBank };

          if (Object.keys(presetsByBank).length === 0) {
            showToast(
              "No custom presets parameters found. Default presets do not need to be exported.",
              "warning",
            );
            return;
          }

          // Create a downloadable plain text data blob stream
          const dataStr =
            "data:text/json;charset=utf-8," +
            encodeURIComponent(JSON.stringify(backupPayload, null, 2));
          const downloadAnchor = document.createElement("a");
          downloadAnchor.setAttribute("href", dataStr);
          downloadAnchor.setAttribute(
            "download",
            `Cheque_Printer_Config_Backup_${new Date().toISOString().split("T")[0]}.json`,
          );
          document.body.appendChild(downloadAnchor);
          downloadAnchor.click();
          downloadAnchor.remove();
        };

        // Reads an uploaded file and overrides local presets with the new parameters
        const importConfigurationsFromFile = (event) => {
          const fileReader = new FileReader();
          const targetFile = event.target.files[0];

          if (!targetFile) return;

          fileReader.onload = (e) => {
            try {
              const importedPayload = JSON.parse(e.target.result);
              let validImportCount = 0;

              // v2 files keep lists under "presets"; old files are { bank: fields }
              const isV2 = importedPayload.version === 2;
              const source = isV2
                ? importedPayload.presets || {}
                : importedPayload;

              Object.keys(source).forEach((bankKey) => {
                if (!BANK_KEYS.includes(bankKey)) return;

                // Normalise incoming data into a list of valid presets
                let incoming = [];
                if (isV2) {
                  incoming = (
                    Array.isArray(source[bankKey]) ? source[bankKey] : []
                  ).filter(
                    (p) =>
                      p &&
                      p.id &&
                      p.name &&
                      p.fields &&
                      !String(p.id).startsWith("builtin_"),
                  );
                } else if (
                  source[bankKey] &&
                  typeof source[bankKey] === "object"
                ) {
                  incoming = [
                    {
                      id: "p_" + Date.now() + "_" + bankKey,
                      name: "Imported layout",
                      fields: source[bankKey],
                    },
                  ];
                }
                if (incoming.length === 0) return;

                // Merge: same id replaced, everything else kept
                const merged = [...loadPresets(bankKey)];
                incoming.forEach((preset) => {
                  const idx = merged.findIndex((p) => p.id === preset.id);
                  if (idx >= 0) merged[idx] = preset;
                  else merged.push(preset);
                });

                savePresetList(bankKey, merged);
                validImportCount++;
              });

              if (validImportCount > 0) {
                showToast(
                  `Successfully synchronized ${validImportCount} bank presets! The application will now reload to apply the updates.`,
                  "success",
                );
                // Force a page refresh to clear state memories and reload variables
                window.location.reload();
              } else {
                showToast(
                  "Invalid format: The file uploaded does not contain compatible bank calibration parameters.",
                  "error",
                );
              }
            } catch (error) {
              showToast(
                "Critical Parse Error: Unable to read file layout. Make sure it is a valid backup configuration JSON file.",
                "error",
              );
            }
          };

          fileReader.readAsText(targetFile);
        };

        // Global System Trigger for Non-Intrusive Toast Alerts
        const showToast = (message, type = "success") => {
          const uniqueId = new Date().getTime() + Math.random();

          // Append new item to stack
          setToasts((prevToasts) => [
            ...prevToasts,
            { id: uniqueId, message, type },
          ]);

          // Background countdown timer to handle automatic dismissal loops after 4000ms
          setTimeout(() => {
            setToasts((prevToasts) =>
              prevToasts.filter((toast) => toast.id !== uniqueId),
            );
          }, 4000);
        };

        // Intercepts when the operator clicks down on the workspace canvas background
        const handleCanvasMouseDown = (e) => {
          // Block actions if a verification prompt layer is locked over the viewport
          if (showVerifyToast) return;

          setIsDraggingCanvas(true);
          // Store the exact screen coordinates where the grab gesture started
          setDragStartPoint({
            x: e.clientX - panOffset.x,
            y: e.clientY - panOffset.y,
          });
        };

        // Recalculates offsets continuously as the mouse moves across coordinates
        const handleCanvasMouseMove = (e) => {
          if (!isDraggingCanvas || showVerifyToast) return;

          // Deduct current coordinates from start anchors to find displacement vectors
          setPanOffset({
            x: e.clientX - dragStartPoint.x,
            y: e.clientY - dragStartPoint.y,
          });
        };

        // Disengages dragging calculations when clicking actions release
        const handleCanvasMouseUpOrLeave = () => {
          setIsDraggingCanvas(false);
        };

        // Utility method to clear pan translations and return sheet to dead center
        const resetCanvasView = () => {
          setZoomFactor(DEFAULT_ZOOM_FACTOR);
          setPanOffset({ x: 0, y: 0 });
        };

        // Dynamic string parsing computing with responsive word wrap thresholds
        const generatedWords = convertAmountToIndianWords(amount);
        const amountBoxMode = fields.amountNumeric?.boxWidth !== undefined;
        // Max Font Size (as a fraction of box height) before the amount gets shrunk to fit
        const fitNow = amountBoxMode
          ? maxFitRatio(formatChequeAmount(amount), fields.amountNumeric)
          : null;
        const fitLongest = amountBoxMode
          ? maxFitRatio(
              formatChequeAmount("99999999999.99"),
              fields.amountNumeric,
            )
          : null;
        const boxFieldKey =
          (activeFieldKey === "amountNumeric" || activeFieldKey === "date") &&
          fields[activeFieldKey]?.boxWidth !== undefined
            ? activeFieldKey
            : null;
        const fitDate =
          fields.date?.boxWidth !== undefined
            ? maxFitRatioCells(fields.date)
            : null;
        // Payee on the printed-line layout
        const usePayeeSvg =
          fields.payee?.lineTop !== undefined && !!fields.cheque;
        const payeeLayout = usePayeeSvg
          ? layoutBaselineLines(
              payeeName,
              fields.payee,
              maxPayeeLine1Chars,
              fields.cheque.width,
            )
          : null;
        // The preview shows a placeholder when the name is empty; print prints nothing
        const payeePreviewLayout =
          usePayeeSvg && payeeLayout.rows.length === 0
            ? layoutBaselineLines(
                "[Payee Name]",
                fields.payee,
                maxPayeeLine1Chars,
                fields.cheque.width,
              )
            : payeeLayout;

        // Amount in words on the printed-line layout
        const useWordsSvg =
          fields.amountWords?.lineTop !== undefined && !!fields.cheque;
        const wordsLayout = useWordsSvg
          ? layoutBaselineLines(
              generatedWords,
              fields.amountWords,
              maxLine1Chars,
              fields.cheque.width,
            )
          : null;
        // The preview shows a placeholder when there is no amount; print prints nothing
        const wordsPreviewLayout =
          useWordsSvg && wordsLayout.rows.length === 0
            ? layoutBaselineLines(
                "[Amount in words]",
                fields.amountWords,
                maxLine1Chars,
                fields.cheque.width,
              )
            : wordsLayout;
        const lineFieldKey =
          (activeFieldKey === "payee" || activeFieldKey === "amountWords") &&
          fields[activeFieldKey]?.lineTop !== undefined
            ? activeFieldKey
            : null;
        const lineLayout =
          lineFieldKey === "payee"
            ? payeeLayout
            : lineFieldKey === "amountWords"
              ? wordsLayout
              : null;
        const rawSplitDateArray = formatSplitDate(chequeDate);
        const chequeW = fields.cheque?.width ?? PRINT_CANVAS.width;
        const chequeH = fields.cheque?.height ?? PRINT_CANVAS.height;

        // ---- Basics: Text size and the main position settings (always visible) ----
        const boxH = Number(fields[boxFieldKey]?.boxHeight) || 1;
        const fitHere = boxFieldKey === "date" ? fitDate : fitNow;
        const mm1 = (v) => `${Math.floor(v * 10) / 10} mm`;

        let basicSize = null;
        if (lineFieldKey) {
          const shrunk = !!lineLayout && lineLayout.shrink < 0.999;
          basicSize = {
            value: fields[lineFieldKey].textHeight ?? 0,
            onChange: (e) =>
              updateFieldProperty(lineFieldKey, "textHeight", e.target.value),
            warn: shrunk,
            hint: (
              <React.Fragment>
                {lineLayout?.maxTextHeight != null && (
                  <div>
                    Max for this text: {mm1(lineLayout.maxTextHeight)}
                    {shrunk ? " (shrunk to fit)" : ""}
                  </div>
                )}
                <div>
                  {lineLayout && lineLayout.rows.length > 1
                    ? `Line 2 is used because of the ${
                        lineLayout.wrappedBy === "limit"
                          ? "character limit"
                          : "available width"
                      }.`
                    : "The text fits on one line."}
                </div>
              </React.Fragment>
            ),
          };
        } else if (boxFieldKey) {
          const share = Number(fields[boxFieldKey].heightRatio) || 0;
          const shrunk = fitHere !== null && share > fitHere + 0.0005;
          basicSize = {
            value: Number((share * boxH).toFixed(2)), // digit height in mm
            onChange: (e) =>
              updateFieldProperty(
                boxFieldKey,
                "heightRatio",
                Math.min(1, (parseFloat(e.target.value) || 0) / boxH),
              ),
            warn: shrunk,
            hint: (
              <React.Fragment>
                {fitHere !== null && (
                  <div>
                    {boxFieldKey === "date"
                      ? "Max for this font"
                      : "Max for this amount"}
                    : {mm1(fitHere * boxH)}
                    {shrunk ? " (shrunk to fit)" : ""}
                  </div>
                )}
                {boxFieldKey !== "date" && fitLongest !== null && (
                  <div>Max for longest amount: {mm1(fitLongest * boxH)}</div>
                )}
              </React.Fragment>
            ),
          };
        } else if (activeFieldKey !== "all") {
          basicSize = {
            value: fields[activeFieldKey]?.fontSize ?? 0,
            onChange: (e) =>
              updateFieldProperty(activeFieldKey, "fontSize", e.target.value),
          };
        }

        const posField = (key, label) => ({
          key,
          label,
          step: "0.5",
          value: fields[activeFieldKey]?.[key] ?? 0,
          onChange: (e) =>
            updateFieldProperty(activeFieldKey, key, e.target.value),
        });
        const basicPos =
          activeFieldKey === "all"
            ? [
                {
                  key: "gl",
                  label: "Move all right (mm, - = left)",
                  step: "0.5",
                  value: globalOffset.left,
                  onChange: (e) =>
                    setGlobalOffset((p) => ({
                      ...p,
                      left: parseFloat(e.target.value) || 0,
                    })),
                },
                {
                  key: "gt",
                  label: "Move all down (mm, - = up)",
                  step: "0.5",
                  value: globalOffset.top,
                  onChange: (e) =>
                    setGlobalOffset((p) => ({
                      ...p,
                      top: parseFloat(e.target.value) || 0,
                    })),
                },
                {
                  key: "cw",
                  label: "Cheque width (mm)",
                  step: "0.1",
                  value: fields.cheque?.width ?? 0,
                  onChange: (e) => {
                    const v = parseFloat(e.target.value);
                    if (v > 0)
                      setFields({
                        ...fields,
                        cheque: { ...fields.cheque, width: v },
                      });
                  },
                },
                {
                  key: "ch",
                  label: "Cheque height (mm)",
                  step: "0.1",
                  value: fields.cheque?.height ?? 0,
                  onChange: (e) => {
                    const v = parseFloat(e.target.value);
                    if (v > 0)
                      setFields({
                        ...fields,
                        cheque: { ...fields.cheque, height: v },
                      });
                  },
                },
              ]
            : lineFieldKey === "payee"
              ? [
                  posField("textLeft", "Text starts: from left edge (mm)"),
                  posField("lineTop", "Printed line: from top edge (mm)"),
                ]
              : lineFieldKey === "amountWords"
                ? [
                    posField("textLeft", "Line 1 text starts: from left (mm)"),
                    posField("line2Left", "Line 2 text starts: from left (mm)"),
                    posField("lineTop", "Line 1 printed line: from top (mm)"),
                    posField("line2Top", "Line 2 printed line: from top (mm)"),
                  ]
                : boxFieldKey
                  ? [
                      posField("boxRight", "Box: from right edge (mm)"),
                      posField("boxTop", "Box: from top edge (mm)"),
                    ]
                  : [
                      posField("left", "Left (mm)"),
                      posField("top", "Top (mm)"),
                    ];

        // Turn any cheque field on or off. Turning it off also drops its highlight
        const setFieldEnabled = (key, on) => {
          setFieldsOn((prev) => ({ ...prev, [key]: on }));
          if (!on && focusKey === key) setHasFocus(false);
        };

        const resetFieldsOn = () => setFieldsOn(DEFAULT_FIELDS_ON);

        // Turn on just one of the four cheque fields and turn the other three off.
        // A/C Payee is left as it is.
        const showOnly = (key) => {
          setFieldsOn((prev) => ({
            ...prev,
            payee: key === "payee",
            amountWords: key === "amountWords",
            amountNumeric: key === "amountNumeric",
            date: key === "date",
          }));
          if (focusKey && focusKey !== key && focusKey !== "acPayee")
            setHasFocus(false); // a highlighted field that just turned off looks out of place
        };

        // Turn all four cheque fields back on. A/C Payee is left as it is.
        const allFieldsOn = () =>
          setFieldsOn((prev) => ({
            ...prev,
            payee: true,
            amountWords: true,
            amountNumeric: true,
            date: true,
          }));

        // Which quick button matches the current switches: one field alone, all four, or none
        const quickKeys = ["payee", "amountNumeric", "amountWords", "date"];
        const onKeys = quickKeys.filter((k) => fieldsOn[k]);
        const quickMode =
          onKeys.length === 4 ? "all" : onKeys.length === 1 ? onKeys[0] : null;

        const handleAmountNumericalChange = (e) => {
          const el = e.target;
          const typed = el.value;
          let caretChars = countAmountChars(typed, el.selectionStart);
          let raw = typed.replace(/,/g, "");

          // Backspace/Delete next to a comma only removes the comma, and the formatting
          // would put it straight back. Delete the neighbouring digit instead.
          const kind = e.nativeEvent.inputType;
          if (
            raw === amount &&
            (kind === "deleteContentBackward" ||
              kind === "deleteContentForward")
          ) {
            const at =
              kind === "deleteContentBackward" ? caretChars - 1 : caretChars;
            if (at >= 0 && at < raw.length) {
              raw = raw.slice(0, at) + raw.slice(at + 1);
              if (kind === "deleteContentBackward") caretChars = at;
            }
          }

          // Keep the caret where the user was, whatever happens next
          amountCaretRef.current = caretChars;
          setCaretTick((t) => t + 1);

          if (raw === "") {
            setAmount("");
            return;
          }
          // Digits only, one decimal point, max 2 decimal digits (paise)
          if (!/^\d*\.?\d{0,2}$/.test(raw)) return;

          const maxLimit = 99999999999; // 9,999 Crores baseline cap (rupees part)
          const hasDot = raw.includes(".");
          let [intPart, decPart = ""] = raw.split(".");
          const rawInt = intPart;
          intPart = intPart.replace(/^0+(?=\d)/, "") || "0";
          if (rawInt === "") {
            amountCaretRef.current += 1; // ".5" becomes "0.5"
          } else {
            // leading zeros were removed: the caret moves back by the ones before it
            amountCaretRef.current -= Math.min(
              amountCaretRef.current,
              rawInt.length - intPart.length,
            );
          }
          if (Number(intPart) > maxLimit) intPart = String(maxLimit);
          setAmount(hasDot ? `${intPart}.${decPart}` : intPart);
        };

        // Modal to search, add and delete saved payee names. Changes apply instantly.
        function PayeeManagerModal({
          names,
          currentPayee,
          onSelect,
          onAdd,
          onDelete,
          onClose,
        }) {
          const [query, setQuery] = React.useState("");
          const [lastDeleted, setLastDeleted] = React.useState(null); // for the Undo line
          const inputRef = React.useRef(null);

          React.useEffect(() => {
            inputRef.current?.focus();
            inputRef.current?.select();
          }, []);

          const q = cleanPayeeName(query);
          const qLower = q.toLowerCase();
          const sorted = React.useMemo(
            () =>
              sortBy === "alpha"
                ? [...names].sort((a, b) =>
                    a.localeCompare(b, undefined, { sensitivity: "base" }),
                  )
                : names, // already stored most recent first
            [names, sortBy],
          );
          const shown = sorted.filter((n) => n.toLowerCase().includes(qLower));
          const canAdd =
            q !== "" && !names.some((n) => n.toLowerCase() === qLower);
          const current = cleanPayeeName(currentPayee);
          const canSaveCurrent =
            q === "" &&
            current !== "" &&
            !names.some((n) => n.toLowerCase() === current.toLowerCase());

          const add = (name) => {
            onAdd(name);
            if (lastDeleted && lastDeleted.toLowerCase() === name.toLowerCase())
              setLastDeleted(null);
          };

          return (
            <div
              className="fixed inset-0 z-[96] flex items-center justify-center bg-slate-950/70 backdrop-blur-sm no-print select-none animate-fade-in"
              onClick={onClose}
              onKeyDown={(e) => e.key === "Escape" && onClose()}
            >
              <div
                className="w-[28rem] max-w-[92vw] bg-slate-950 border border-slate-700 rounded-2xl p-5 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.8)] space-y-3"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex items-center justify-between">
                  <h4 className="text-base font-bold text-slate-100 tracking-tight">
                    Payee names{" "}
                    <span className="text-xs font-normal text-slate-500">
                      ({names.length})
                    </span>
                  </h4>
                  <button
                    type="button"
                    onClick={onClose}
                    className="px-2 text-slate-400 hover:text-white text-lg leading-none cursor-pointer"
                    aria-label="Close"
                  >
                    ✕
                  </button>
                </div>

                <input
                  ref={inputRef}
                  type="text"
                  value={query}
                  onChange={(e) => setQuery(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === "Enter" && canAdd) {
                      e.preventDefault();
                      add(q);
                    }
                  }}
                  placeholder="Search, or type a new name and press Enter"

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
